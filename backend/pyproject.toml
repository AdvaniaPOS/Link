[project]
name = "betala-link-backend"
version = "0.1.0"
description = "Betala Link – multi-tenant Digital Product Pass backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "resend>=2.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------- Security headers (sent on every response) ----------
    # CSP: allow same-origin assets only; permit data: images for inline
    # previews, and allow fetch to same origin (where /api and /uploads live).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # SPA fallback: serve index.html for unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the SPA shell itself
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Proxy API + uploads to the backend container.
    # In docker-compose the backend service is reachable as `backend:8000`.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        # Uploads are content-addressable (random suffix in filename) so they
        # are safe to cache aggressively.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}
